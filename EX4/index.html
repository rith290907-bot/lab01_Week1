 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADT Shop</title>
 </head>
 <body>
    <style>
        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }
        h2 {
            text-align: center;
            color: aquamarine;
        }
        table {
            width: 80%;
            margin: auto;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: lightblue;
        }
        img {
            width: 80px;
            height: 100px;
        }
        tr{
            width: 100px;
            height: 120px;
        }
    </style>
    
    <h1>Welcome to CADT Shop!</h1>

    <h2>Product Catalog</h2>

    <table>
        <tr>
            <th>Thumbnail</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>In Stock</th>
        </tr>

        <tr>
            <td>
                <img src="https://images.booksense.com/images/155/594/9781590594155.jpg" alt="C# Book">
            </td>
            <td>C# Book</td>
            <td>$10</td>
            <td>5</td>
            <td>YES</td>
        </tr>

        <tr>
            <td>
                <img src="https://cadt.edu.kh/wp-content/uploads/2025/09/Lecturers-Profile-10.webp" alt="CADT Polo">
            </td>
            <td>CADT Polo</td>
            <td>$12</td>
            <td>60</td>
            <td>YES</td>
        </tr>

        <tr>
            <td>
                <img src="https://cdn.sandberg.world/products/images/lg/640-27_lg.jpg" alt="CADT Mouse">
            </td>
            <td>CADT Mouse</td>
            <td>$100</td>
            <td>3</td>
            <td>NO</td>
        </tr>

    </table>
 </body>
 </html>
